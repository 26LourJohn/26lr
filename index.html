<!DOCTYPE html>
<html lang="en">
<head>
<script type="text/javascript" src="26lrClock.js"></script>
<style>
    body {
        font-family: system-ui, -apple-system, sans-serif;
        margin: 0;
        text-align: center;
        padding: 60px 20px 60px;
        background:rgb(107, 31, 31);
        color: white;
      }

      .time {
        font-weight: bold;
        font-family: monospace;
      }
      .big {
        font-size: 2.5rem;
        margin: 20px 0;
        }
      .small {
        font-size: 1rem;
      }
      .btn {
        display: inline-block;
        padding: 10px 24px;
        background: white;
        color: #4f46e5;
        text-decoration: none;
        border-radius: 50px;
        font-weight: bold;
      }
  </style>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>26lr.com</title>
</head>
<body>

  <main>
    <a href="worldcup-26lr.html" class="btn">26lr World Cup Schedule</a>
      <h2>26 Lours. 0 Time Zones</h2>
      <p class="time"><span id="lentury" class="small"></span>
      <span id="live-26lr" class="big"></span>
      <span id="licro" class="small time"></span></p>
      <p>Lour :A is 12 PM UTC (<span id="localA"></span>) </p>
      <p>A: is Monday, B: Tuesday, G: Sunday.</p>
      <p>Based on Julian Date (<span id="JulianDate"></span>) </p>
      <p>Convert <input type="input" onchange="convert(this.value)"> = <span id="output"></span></p>
      <p>26lrClock shows timezone or sundial time</p>
      <a href="https://26lourjohn.github.io/26lrClock/26lrClock.html" class="btn">26lr Clock App</a>
      <a href="https://26lourjohn.github.io/26lrSundial/26lrSundial.html" class="btn">26lr Sundial</a>
  </main>
</body>

<script>

const todayA = new Date().from26Lr('A');
const localTimeStr = todayA.toLocaleTimeString(undefined, {
  hour: 'numeric', minute: '2-digit', hour12: true 
});
const zoneStr = new Intl.DateTimeFormat(undefined, { 
  timeZoneName: 'short' 
}).formatToParts(todayA).find(part => part.type === 'timeZoneName').value;
document.getElementById('localA').textContent = `${localTimeStr} ${zoneStr}`;

function updateLiveTime() {
  const now = new Date();
  const now26 = now.to26lr();
  const jd = now.toJulian().toFixed(5); 
  document.getElementById('lentury').textContent = now26.slice(0, 2);
  document.getElementById('live-26lr').textContent = now26.slice(2, 9);
  document.getElementById('licro').textContent = now26.slice(9, 10);
  document.getElementById('JulianDate').textContent = jd;
}
function convert(i){
  var o;
  var d = new Date(i);
  if (!isNaN(d.getTime())){
    o = d.to26lr();
  } else {
    const localFormatter = new Intl.DateTimeFormat(undefined, { dateStyle: 'short', timeStyle: 'short' });
    o = localFormatter.format(new Date().from26Lr(i));
  }
  document.getElementById('output').textContent = o;
}

setInterval(updateLiveTime, 86400000/(26*26*26*26));
</script>
</html>
