const localFormatter = new Intl.DateTimeFormat(undefined, { dateStyle: 'short', timeStyle: 'short' });
const tzAbbreviation = new Intl.DateTimeFormat(undefined, {timeZoneName: 'long'})
        .formatToParts(new Date())
        .find(part => part.type === 'timeZoneName')
        .value;
document.getElementById('timezonehdr').innerHTML = tzAbbreviation;

const now = new Date().getTime(); 
const TWO_HOURS_MS = 2 * 60 * 60 * 1000;
let rowToScrollTo = null;

matches.forEach((m) => {
  const matchDate = new Date(`${m.date}T${m.utcTime}:00Z`);
  let lrTime = "js file missing";
  let eot = "js file missing";
  let realTime = "js missing";
  try {
    if (typeof matchDate.to26lr === 'function') {
        lrTime = matchDate.to26lr().slice(2,9);
        realTime = matchDate.realTime(m.lon);
      }
  } catch(e) {}

  const matchTime = matchDate.getTime();
  const matchEndTime = matchTime + TWO_HOURS_MS;
  
  const row = document.createElement('tr');
  row.classList.add('match-row');
  if (now > matchEndTime) {
    row.classList.add('past');
  } else if (now >= matchTime && now <= matchEndTime) {
      row.classList.add('current');
      if (!rowToScrollTo) {
        rowToScrollTo = row; 
      }
  } else {
    row.classList.add('future');
    if (!rowToScrollTo) {
      rowToScrollTo = row;
    }
