        function pad(n) { return n < 10 ? '0' + n : n; }

        function renderTable() {
            const localFormatter = new Intl.DateTimeFormat(undefined, { dateStyle: 'short', timeStyle: 'short' });

            const tzAbbreviation = new Intl.DateTimeFormat(undefined, {timeZoneName: 'long'})
                    .formatToParts(new Date())
                    .find(part => part.type === 'timeZoneName')
                    .value;

            document.getElementById('timezonehdr').innerHTML = tzAbbreviation;

            const tbody = document.querySelector('#wcTable tbody');
            tbody.innerHTML = '';
            
            matches.forEach(m => {
                const row = document.createElement('tr');
                const matchDate = new Date(`${m.date}T${m.utcTime}:00Z`);
                const formattedDate = localFormatter.format(matchDate);
                let lrTime = "js file missing";
                let eot = "js file missing";
                let realTime = "js missing";
                try {
                    if (typeof matchDate.to26lr === 'function') {
                        lrTime = matchDate.to26lr().slice(2,9);
                        realTime = matchDate.realTime(m.lon);
                    }
                } catch(e) {}
                
                row.innerHTML = `
                    <td class="lr"><a href="https://26lourjohn.github.io/26lrClock/26lrClock.html?t=${lrTime}" style="color: inherit;">${lrTime}</a></td>
                    <td class="utc">${formattedDate}</td>
                    <td><strong>${m.match}</strong></td>
                    <td>${m.city}</td>
                    <td>${realTime}</td>`;
                tbody.appendChild(row);
            });
        }
